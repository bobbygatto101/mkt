<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>כל השאלות מהחוברת – גרסה מאתגרת</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--fg:#1d1d1b;--mut:#6b6b66;--line:#e2e1da;--ok:#1f7a3f;--okbg:#e6f4ea;--bad:#b3261e;--badbg:#fbe9e7;--acc:#2f5bd3;--accfg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#16171a;--card:#1e1f23;--fg:#ececea;--mut:#9a9a95;--line:#33343a;--ok:#6fd394;--okbg:#17321f;--bad:#ff8a80;--badbg:#3a1a18;--acc:#8aa8ff;--accfg:#10131c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 60px}
h1{margin:0 0 4px;font-size:26px} .mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:16px 0}
.pick{text-align:start;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.pick:hover{border-color:var(--acc)} .pick b{display:block} .pick span{color:var(--mut);font-size:14px}
.opts{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 0}
label{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:15px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--acc);width:0}
.q{font-size:20px;font-weight:600;margin:0 0 14px;white-space:pre-line}
:root{color-scheme:light dark}
img{background:#fff;max-width:260px;width:100%;border:1px solid var(--line);border-radius:8px;display:block;margin:0 0 14px}
.ans{display:flex;flex-direction:column;gap:8px}
.ans button{font:inherit;text-align:start;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.ans button:hover:not(:disabled){border-color:var(--acc)}
.ans button.sel{border-color:var(--acc)}
.ans button.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
.ans button.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.ans button:disabled{cursor:default}
.fb{min-height:28px;margin:14px 0 0;font-weight:600}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--acc);color:var(--accfg);font-weight:600}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.big{font-size:44px;font-weight:700;margin:6px 0}
.hint{font-size:14px;color:var(--mut);margin:-6px 0 12px}
</style></head><body><main id="app"></main>

רטי של מדינה מבוסס על שתי מערכות. מהן?", "a": ["פורמלית-מוסדית וערכית-תרבותית", "מחוקקת-שופטת ומבצעת-מנהלית", "צבאית-ביטחונית ואזרחית-חברתית", "דתית-מסורתית וחילונית-ליברלית"], "c": [0], "p": 16, "o": "dup"}, {"q": "מה מהבאים שייך למערכת הפורמלית-מוסדית של הדמוקרטיה?", "a": ["הכרעת הרוב, אופוזיציה ובחירות חופשיות", "שמירה על כבוד האדם וזכויות מיעוטים", "השאיפה לחירות ולשוויון בין כל האזרחים", "מדיניות רווחה, אפליה מתקנת ושוויון"], "c": [0], "p": 16, "o": "new"}, {"q": "מה מהבאים שייך למערכת הערכית-תרבותית של הדמוקרטיה?", "a": ["שמירה על זכויות מיעוטים וקבלת תוצאות הבחירות", "קיום בחירות חופשיות ושוויוניות אחת לארבע שנים", "הכרעת הרוב בכנסת ובממשלה בכל נושא מהותי", "קיום אופוזיציה חזקה ופעילה בכנסת ישראל"], "c": [0], "p": 16, "o": "new"}, {"q": "מהו העיקרון הבסיסי המשותף לכל הדמוקרטיות לפי החוברת?", "a": ["ריבונות העם", "הפרדת דת ומדינה", "שיטת בחירות אזורית", "קיום חוקה כתובה"], "c": [0], "p": 16, "o": "new"}, {"q": "מה עלול לקרות לפי החוברת במצב בו אין הפרדת רשויות?", "a": ["שחיתות שלטונית ופגיעה בזכויות המיעוט", "חיזוק הדמוקרטיה ושיפור היעילות השלטונית", "מעבר הדרגתי לשיטת בחירות אזורית ואישית", "פיזור הכנסת באופן אוטומטי ובחירות חדשות"], "c": [0], "p": 16, "o": "new"}, {"q": "אחת לכמה שנים נבחרת הכנסת (בהנחה שאין בחירות מוקדמות)?", "a": ["ארבע שנים", "שלוש שנים", "חמש שנים", "שש שנים"], "c": [0], "p": 16, "o": "new"}, {"q": "מהי שיטת הבחירות בישראל לפי החוברת?", "a": ["פרלמנטרית – הציבור בוחר במפלגות", "נשיאותית – הציבור בוחר בראש הממשלה", "אזורית – הציבור בוחר במועמד מאזורו", "עקיפה – מועצת המדינה בוחרת את הכנסת"], "c": [0], "p": 16, "o": "dup"}, {"q": "מה קורה כאשר האופוזיציה גדולה מהקואליציה?", "a": ["הממשלה אינה יכולה לפעול ותקום ממשלה חדשה", "הממשלה ממשיכה לכהן כרגיל עד הבחירות הבאות", "נשיא המדינה מקבל לידיו את סמכויות הממשלה", "בג\"ץ ממנה ממשלת מעבר עד להרכבת קואליציה"], "c": [0], "p": 17, "o": "new"}, {"q": "מהם התנאים לכך שחוק שמחוקקת הכנסת ייחשב \"חוקתי\"?", "a": ["שאינו סותר את חוקי היסוד ואת הגדרת המדינה", "שאושר בחתימתו של נשיא המדינה ושל ראש הממשלה" const app=document.getElementById('app');
let S=null; const opt={shuffle:true,limit:0};

function home(){

  app.querySelector('#sh').onchange=e=>opt.shuffle=e.target.checked;
  app.querySelector('#lim').onchange=e=>opt.limit=+e.target.value;

  });
}
function start(name,qs){

}
function show(){
  const q=S.list[S.idx], multi=q.c.length>1;
